<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M3U TV Player</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>

<style>
  :root {
    font-family: -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    --accent: #6c5ce7;
    --accent-hover: #5a4bcf;
    --text: #f2f3f7;
    --muted: #9aa0b4;
    --bg-dark: rgba(15, 17, 23, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    width: 100vw; height: 100vh; 
    background: #000; overflow: hidden; 
    color: var(--text); 
  }
  [hidden] { display: none !important; }

  /* Login / Startseite */
  #home {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #0b0c10;
  }
  .home-card { width: min(480px, 90vw); text-align: center; background: #14161e; padding: 35px; border-radius: 16px; border: 1px solid #232736; }
  .home-logo {
    width: 64px; height: 64px; margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #00cec9);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: #fff;
  }
  .home-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  
  .tv-input {
    width: 100%;
    background: #1c1f2c;
    color: var(--text);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
    text-align: center;
  }
  
  .focusable:focus, .tv-input:focus, button:focus {
    border-color: #00cec9 !important;
    background: #252a3c !important;
    box-shadow: 0 0 14px rgba(0, 206, 201, 0.5) !important;
  }

  .home-actions button {
    width: 100%; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; background: var(--accent); color: #fff;
  }
  .home-hint { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .home-error { margin-top: 12px; font-size: 13px; color: #ff6b6b; min-height: 18px; }

  /* Loader Status */
  .loader-status {
    margin-top: 15px;
    font-size: 13px;
    color: #00cec9;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0, 206, 201, 0.3);
    border-top: 2px solid #00cec9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* Vollbild-Player */
  #player { 
    position: fixed; top: 0; left: 0; 
    width: 100vw; height: 100vh; 
    background: #000; z-index: 1;
  }

  #video { 
    position: absolute; top: 0; left: 0;
    width: 100vw; height: 100vh; 
    background: #000; display: block; 
  }

  /* Bildformate */
  #video.fmt-169  { object-fit: contain; }
  #video.fmt-zoom { object-fit: cover; }
  #video.fmt-43   { object-fit: contain; width: 75vw; left: 12.5vw; }
  #video.fmt-fill { object-fit: fill; }

  /* Seitliches Panel */
  #sidePanel {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 10;
    width: 38%; min-width: 320px; max-width: 500px;
    background: linear-gradient(90deg, rgba(10,11,16,0.96) 0%, rgba(10,11,16,0.85) 85%, rgba(10,11,16,0) 100%);
    opacity: 0; transform: translateX(-100%);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none; display: flex; flex-direction: column;
  }
  #sidePanel.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
  
  .panel-head { padding: 25px 20px 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

  .format-control { padding: 0 16px 10px; }
  #fmtBtn {
    width: 100%; padding: 10px;
    background: #1c1f2c; color: #00cec9;
    border: 1px solid #00cec9; border-radius: 8px;
    font-size: 13px; font-weight: bold; cursor: pointer; text-align: center;
  }

  #channelList { flex: 1; overflow-y: auto; padding: 4px 12px 30px 12px; }

  .channel {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text);
    margin-bottom: 4px;
  }
  .channel-logo {
    width: 36px; height: 36px; border-radius: 6px; object-fit: contain; background: rgba(255,255,255,0.05); flex-shrink: 0;
  }
  .channel-info { min-width: 0; flex: 1; }
  .channel .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel .epg-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .channel.focus {
    background: linear-gradient(90deg, rgba(108,92,231,0.9), rgba(108,92,231,0.3) 85%);
    border-left: 4px solid #00cec9;
  }
  .channel.playing .name::after { content: "  ▶"; font-size: 12px; color: #00cec9; }

  /* Infobalken unten bei Senderwechsel */
  #infoBar {
    position: absolute; left: 40px; right: 40px; bottom: 30px; z-index: 8;
    padding: 18px 24px; border-radius: 14px;
    background: rgba(15, 17, 23, 0.92); border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 18px;
    opacity: 0; transform: translateY(20px); transition: opacity .3s ease, transform .3s ease; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  #infoBar.show { opacity: 1; transform: translateY(0); }
  #infoLogo { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.05); }
  #infoName { font-size: 20px; font-weight: 700; color: #fff; }
  #infoEpg { font-size: 13px; color: #00cec9; margin-top: 2px; }

  #toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 99;
    background: rgba(10,10,14,0.95); color: var(--text);
    padding: 12px 24px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: all .25s; pointer-events: none; border: 1px solid var(--accent);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<section id="home">
  <div class="home-card">
    <div class="home-logo">M3U</div>
    <h1>M3U TV Player</h1>
    <input type="text" id="loginInput" class="tv-input focusable" placeholder="5-stelliger Code ODER M3U-URL" autocomplete="off" />
    <div class="home-actions">
      <button id="loadBtn" class="focusable">Anmelden / Laden</button>
    </div>
    <div id="loaderStatus" class="loader-status" hidden>
      <div class="spinner"></div>
      <span id="loaderMsg">Verbindung wird aufgebaut...</span>
    </div>
    <p class="home-hint">Gib deinen 5-stelligen Code ein oder eine direkte M3U-URL.</p>
    <p class="home-error" id="homeError"></p>
  </div>
</section>

<section id="player" hidden>
  <video id="video" class="fmt-169" playsinline autoplay></video>

  <nav id="sidePanel">
    <div class="panel-head">Einstellungen</div>
    <div class="format-control">
      <button id="fmtBtn" class="focusable">Bildformat: 16:9</button>
    </div>
    
    <div class="panel-head">Senderliste <span id="channelCount"></span></div>
    <div id="channelList"></div>
  </nav>

  <footer id="infoBar">
    <img id="infoLogo" src="" alt="" />
    <div>
      <div id="infoName">Sendername</div>
      <div id="infoEpg">Keine EPG Information verfügbar</div>
    </div>
  </footer>
</section>

<div id="toast"></div>

<!-- MiniHLS Engine -->
<script>
class MiniHLS {
  constructor(video, cb) {
    this.video = video; this.cb = cb || {}; this.destroyed = false;
    this.segments = []; this.appended = new Set(); this.ms = null; this.sb = null;
  }
  async fetchText(url) { const res = await fetch(url); if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); }
  async fetchBuf(url) { const res = await fetch(url); if (!res.ok) throw new Error("HTTP " + res.status); return res.arrayBuffer(); }
  parseMedia(text, base) {
    const segs = [];
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (line && !line.startsWith("#")) segs.push({ url: new URL(line, base).href });
    }
    this.segments = segs; return segs;
  }
  async load(url) {
    const text = await this.fetchText(url); if (this.destroyed) return;
    if (/#EXT-X-STREAM-INF/i.test(text)) {
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("#EXT-X-STREAM-INF")) {
          await this.load(new URL(lines[i+1].trim(), url).href); return;
        }
      }
    }
    this.parseMedia(text, url); await this.setupMSE();
  }
  setupMSE() {
    return new Promise((resolve, reject) => {
      this.ms = new MediaSource(); this.video.src = URL.createObjectURL(this.ms);
      this.ms.addEventListener("sourceopen", async () => {
        try {
          this.sb = this.ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
          this.appendLoop(); resolve();
        } catch (e) { reject(e); }
      }, { once: true });
    });
  }
  async appendLoop() {
    if (this.destroyed) return;
    const seg = this.segments.find(s => !this.appended.has(s.url));
    if (!seg) return;
    try {
      const data = await this.fetchBuf(seg.url);
      this.sb.appendBuffer(data); this.appended.add(seg.url);
      this.sb.addEventListener("updateend", () => this.appendLoop(), { once: true });
    } catch (e) { if (this.cb.onError) this.cb.onError("Stream-Fehler"); }
  }
  destroy() {
    this.destroyed = true;
    try { if (this.ms && this.ms.readyState === "open") this.ms.endOfStream(); } catch (e) {}
  }
}
</script>

<script>
(function () {
  "use strict";

  // WICHTIG: Deine Render oder Server-URL hier eintragen
  const SERVER_URL = "https://DEIN-EXISTIERENDER-SERVICE.onrender.com"; 

  const LS_KEY = "m3uTvPlayer.lastLogin";
  let channels = [];
  let activeIndex = -1;
  let focusIndex = 0;
  let currentEngine = null;
  let infoTimeout = null;

  const formats = [
    { id: "fmt-169", label: "Bildformat: 16:9" },
    { id: "fmt-zoom", label: "Bildformat: Zoom" },
    { id: "fmt-43", label: "Bildformat: 4:3" },
    { id: "fmt-fill", label: "Bildformat: Stretch" }
  ];
  let currentFmtIndex = 0;

  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const panel = $("sidePanel");

  document.addEventListener("DOMContentLoaded", () => {
    try {
      if (window.tizen && window.tizen.tvinputdevice) {
        tizen.tvinputdevice.registerKey("Up");
        tizen.tvinputdevice.registerKey("Down");
        tizen.tvinputdevice.registerKey("Left");
        tizen.tvinputdevice.registerKey("Right");
        tizen.tvinputdevice.registerKey("Enter");
        tizen.tvinputdevice.registerKey("Return");
      }
    } catch (e) {}

    const saved = localStorage.getItem(LS_KEY);
    if (saved) $("loginInput").value = saved;
    $("loginInput").focus();
  });

  document.addEventListener("keydown", (e) => {
    const isPlayerVisible = !$("player").hidden;

    switch (e.keyCode) {
      case 38: // HOCH
        if (!isPlayerVisible) {
          $("loginInput").focus();
        } else if (panel.classList.contains("show")) {
          setFocus(focusIndex - 1);
        } else {
          showPanel(true);
        }
        break;

      case 40: // RUNTER
        if (!isPlayerVisible) {
          $("loadBtn").focus();
        } else if (panel.classList.contains("show")) {
          setFocus(focusIndex + 1);
        } else {
          showPanel(true);
        }
        break;

      case 13: // OK / ENTER
        if (!isPlayerVisible) {
          handleLogin();
        } else if (panel.classList.contains("show")) {
          if (focusIndex === 0) {
            toggleFormat();
          } else {
            selectAndPlay(focusIndex - 1);
          }
        } else {
          showPanel(true);
        }
        break;

      case 10009: // RETURN / ZURÜCK
        if (isPlayerVisible) {
          if (panel.classList.contains("show")) {
            showPanel(false);
          } else {
            if (currentEngine) { currentEngine.destroy(); currentEngine = null; }
            video.pause();
            video.removeAttribute("src");
            video.load();
            $("player").hidden = true;
            $("home").hidden = false;
            $("loginInput").focus();
          }
        } else {
          try { tizen.application.getCurrentApplication().exit(); } catch (e) {}
        }
        break;
    }
  });

  $("loadBtn").addEventListener("click", handleLogin);
  $("fmtBtn").addEventListener("click", toggleFormat);

  function toggleFormat() {
    currentFmtIndex = (currentFmtIndex + 1) % formats.length;
    const fmt = formats[currentFmtIndex];
    video.className = fmt.id;
    $("fmtBtn").textContent = fmt.label;
  }

  function showStatus(msg) {
    $("homeError").textContent = "";
    $("loaderMsg").textContent = msg;
    $("loaderStatus").hidden = false;
  }

  function hideStatus() {
    $("loaderStatus").hidden = true;
  }

  async function handleLogin() {
    const input = $("loginInput").value.trim();
    if (!input) { $("homeError").textContent = "Bitte Code oder URL eingeben."; return; }
    localStorage.setItem(LS_KEY, input);

    let m3uUrl = input;

    if (input.length === 5 && !input.startsWith("http")) {
      showStatus("Server wird aufgeweckt & Code abgefragt...");
      try {
        const res = await fetch(`${SERVER_URL}/api/get-m3u?code=${input}`);
        if (!res.ok) throw new Error("Ungültiger Code");
        const data = await res.json();
        m3uUrl = data.url || data.m3u;
      } catch (err) {
        hideStatus();
        $("homeError").textContent = "Fehler: Code nicht gefunden oder Server offline.";
        return;
      }
    }

    showStatus("Senderliste wird geladen...");

    fetch(m3uUrl)
      .then(r => r.text())
      .then(text => {
        showStatus("Senderliste wird verarbeitet...");
        setTimeout(() => {
          channels = parseM3U(text);
          hideStatus();
          if (!channels.length) {
            $("homeError").textContent = "Keine Sender in der Liste gefunden.";
            return;
          }
          startPlayer();
        }, 50);
      })
      .catch(err => {
        hideStatus();
        $("homeError").textContent = "Fehler beim Laden der M3U Playlist.";
      });
  }

  function parseM3U(text) {
    const lines = text.split(/\r?\n/);
    const out = [];
    let pending = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      if (line.startsWith("#EXTINF:")) {
        const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
        const epgMatch = line.match(/tvg-name="([^"]+)"/i);
        const comma = line.indexOf(",");
        
        pending = {
          name: comma >= 0 ? line.slice(comma + 1).trim() : "Unbekannter Sender",
          logo: logoMatch ? logoMatch[1] : "",
          epg: epgMatch ? epgMatch[1] : ""
        };
      } else if (!line.startsWith("#")) {
        out.push({
          name: pending ? pending.name : "Sender " + (out.length + 1),
          logo: pending ? pending.logo : "",
          epg: pending ? pending.epg : "Keine EPG Information",
          url: line
        });
        pending = null;
      }
    }
    return out;
  }

  function startPlayer() {
    $("home").hidden = true;
    $("player").hidden = false;
    $("channelCount").textContent = "(" + channels.length + ")";
    renderList();
    showPanel(true);
  }

  function renderList() {
    const listEl = $("channelList");
    listEl.innerHTML = channels.map((c, i) => {
      const idx = i + 1;
      const logoHtml = c.logo ? `<img class="channel-logo" src="${c.logo}" onerror="this.style.display='none'"/>` : `<div class="channel-logo"></div>`;
      return `
        <div class="channel ${idx === focusIndex ? "focus" : ""} ${i === activeIndex ? "playing" : ""}">
          ${logoHtml}
          <div class="channel-info">
            <div class="name">${c.name}</div>
            <div class="epg-preview">${c.epg}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function setFocus(i) {
    focusIndex = Math.max(0, Math.min(channels.length, i));
    
    if (focusIndex === 0) {
      $("fmtBtn").focus();
      renderList();
    } else {
      renderList();
      const focusEl = $("channelList").querySelector(".channel.focus");
      if (focusEl) focusEl.scrollIntoView({ block: "nearest" });
    }
  }

  function showPanel(show) {
    if (show) {
      panel.classList.add("show");
      setFocus(focusIndex);
    } else {
      panel.classList.remove("show");
    }
  }

  async function selectAndPlay(i) {
    showPanel(false);
    activeIndex = i;
    const ch = channels[i];

    $("infoName").textContent = ch.name;
    $("infoEpg").textContent = ch.epg;
    if (ch.logo) {
      $("infoLogo").src = ch.logo;
      $("infoLogo").style.display = "block";
    } else {
      $("infoLogo").style.display = "none";
    }

    const infoBar = $("infoBar");
    infoBar.classList.add("show");
    
    if (infoTimeout) clearTimeout(infoTimeout);
    infoTimeout = setTimeout(() => infoBar.classList.remove("show"), 5000);

    if (currentEngine) { currentEngine.destroy(); currentEngine = null; }

    const streamUrl = ch.url.toLowerCase();
    const isDirectStream = streamUrl.includes(".mpeg") || streamUrl.includes(".ts") || streamUrl.includes(".mkv") || streamUrl.includes(".mp4") || !streamUrl.includes(".m3u8");

    if (isDirectStream) {
      // Direktes Abspielen für .mpeg, .ts und normale HTTP IPTV Streams
      video.src = ch.url;
      video.play().catch(err => {
        toast("Stream kann nicht wiedergegeben werden.");
      });
    } else {
      // HLS Engine für .m3u8 Aufrufe
      video.src = ch.url;
      video.play().catch(() => {
        currentEngine = new MiniHLS(video, { onError: (m) => toast(m) });
        currentEngine.load(ch.url).then(() => video.play()).catch(() => toast("HLS-Fehler beim Abspielen"));
      });
    }
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }
})();
</script>
</body>
</html>
